services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - AI_BASE_URL=${AI_BASE_URL}
      - AI_MODEL=${AI_MODEL}
      - AI_API_KEY=${AI_API_KEY}
      - AI_FALLBACK_MODEL=${AI_FALLBACK_MODEL}
      - DATABASE_URL=file:/app/data/stasis.db
    restart: unless-stopped
